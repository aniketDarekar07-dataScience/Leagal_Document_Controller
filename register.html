<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Legal CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0e1a, #1a1a2e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            margin: auto;
            color: white;
        }
        .register-card h2 { font-weight: 700; }
        .form-control {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0,120,212,0.15);
            color: white;
        }
        .form-label { color: rgba(255,255,255,0.7); }
        .btn-register {
            background: linear-gradient(135deg, #0078d4, #00a4ef);
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-register:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(0,120,212,0.4); color: white; }
        .back-link { color: rgba(255,255,255,0.5); text-decoration: none; }
        .back-link:hover { color: #0078d4; }
        .form-select {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-select option { background: #1a1a2e; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-card">
            <h2 class="text-center"><i class="fas fa-gavel me-2" style="color:#00a4ef;"></i>Legal CMS</h2>
            <p class="text-center text-muted">Create your account</p>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-1"></i>Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope me-1"></i>Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-lock me-1"></i>Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password (min 6 chars)" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user-tag me-1"></i>Role</label>
                    <select class="form-select" id="role">
                        <option value="viewer">👤 Viewer</option>
                        <option value="legal">⚖️ Legal</option>
                        <option value="admin">👑 Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn-register"><i class="fas fa-user-plus me-2"></i>Register</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-0">Already have an account? <a href="/login" style="color:#00a4ef;">Login</a></p>
                <p class="mb-0 mt-2"><a href="/" class="back-link"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Registration successful! Please login.');
                    window.location.href = '/login';
                } else {
                    alert('Registration failed: ' + data.detail);
                }
            } catch (error) {
                alert('Registration failed: ' + error.message);
            }
        });
    </script>
</body>
</html>
