<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Legal CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0e1a, #1a1a2e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            margin: auto;
            color: white;
        }
        .login-card h2 { font-weight: 700; }
        .form-control {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0,120,212,0.15);
            color: white;
        }
        .form-label { color: rgba(255,255,255,0.7); }
        .btn-login {
            background: linear-gradient(135deg, #0078d4, #00a4ef);
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-login:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(0,120,212,0.4); color: white; }
        .back-link { color: rgba(255,255,255,0.5); text-decoration: none; }
        .back-link:hover { color: #0078d4; }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2 class="text-center"><i class="fas fa-gavel me-2" style="color:#00a4ef;"></i>Legal CMS</h2>
            <p class="text-center text-muted">Sign in to your account</p>
            <div class="text-center mb-3">
                <span class="role-badge"><i class="fas fa-user-shield me-1"></i>Admin</span>
                <span class="role-badge"><i class="fas fa-user-tie me-1"></i>Legal</span>
                <span class="role-badge"><i class="fas fa-user me-1"></i>Viewer</span>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope me-1"></i>Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-lock me-1"></i>Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-0">Don't have an account? <a href="/register" style="color:#00a4ef;">Register</a></p>
                <p class="mb-0 mt-2"><a href="/" class="back-link"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></p>
            </div>
            <div class="mt-3 small text-muted text-center">
                <span class="badge bg-secondary me-1">admin@system.com / admin123</span>
                <span class="badge bg-secondary me-1">legal@system.com / legal123</span>
                <span class="badge bg-secondary">viewer@system.com / viewer123</span>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data));
                    
                    // Redirect based on role
                    if (data.role === 'admin') {
                        window.location.href = '/admin/dashboard';
                    } else if (data.role === 'legal') {
                        window.location.href = '/legal/dashboard';
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    alert('Login failed: ' + data.detail);
                }
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        });
    </script>
</body>
</html>
